repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^(corpus/|documents/)
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: ^(corpus/|documents/)

  - repo: local
    hooks:
      - id: validate-terminology
        name: Validate Terminology
        entry: python3 scripts/validate_terminology.py
        language: system
        types: [text, markdown]
        files: README\.md|docs/.*\.md|.*\.md
        pass_filenames: true
        require_serial: true

      - id: vale
        name: Vale Lint
        entry: bash -c 'vale --config .vale.ini --output=line --sort'
        language: system
        types: [text, markdown]
        files: README\.md|docs/.*\.md|.*\.md
        pass_filenames: true
        require_serial: true
        additional_dependencies: []

      - id: check-untranslated-content
        name: Check Untranslated Content
        entry: python3 scripts/check_untranslated_content.py
        language: system
        pass_filenames: false
        require_serial: true


