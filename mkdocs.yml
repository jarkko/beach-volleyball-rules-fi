site_name: Beach Volley -säännöt (FI)
site_description: Beach Volley -säännöt, tuomariohjeet ja tapauskirja suomeksi.
site_author: Beach Volley Rules Team
repo_url: https://github.com/jarkko/beach-volleyball-rules-fi
repo_name: jarkko/beach-volleyball-rules-fi

theme:
  name: material
  language: fi
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

nav:
  - Etusivu: index.md
  - Säännöt (Rules): beach/rules/index.md
  - Tuomariohjeet (Guidelines): beach/guidelines/index.md
  - Tapauskirja (Casebook): beach/casebook/index.md

plugins:
  - search
  # - with-pdf:
  #     cover_subtitle: "Viralliset säännöt"
  #     author: "Suomen Lentopalloliitto"
  #     copyright: "FIVB / Suomen Lentopalloliitto"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
