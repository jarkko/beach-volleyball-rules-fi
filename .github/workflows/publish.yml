name: Publish to GitHub Pages

on:
  workflow_dispatch:
  # NOTE:
  # This workflow deploys via GitHub Pages "Source: GitHub Actions".
  # If the repo is configured to deploy Pages from a branch, GitHub will run the
  # built-in "pages-build-deployment" job instead and this workflow will fail.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p _site

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra \
            fonts-dejavu fonts-liberation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Generate combined Markdown
        run: |
          make combine

      - name: Refresh committed docs for MkDocs
        run: |
          make refresh-docs

      - name: Build PDFs and HTML
        run: |
          make pdf html

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      - name: Build PDFs into site root
        run: |
          cp output/rules-combined.pdf _site/saannot.pdf
          cp output/guidelines-combined.pdf _site/tuomariohjeet.pdf
          cp output/casebook-combined.pdf _site/tapausesimerkit.pdf

      - name: Copy HTML into site root
        run: |
          cp output/rules-combined.html _site/saannot.html
          cp output/guidelines-combined.html _site/tuomariohjeet.html
          cp output/casebook-combined.html _site/tapausesimerkit.html

      - name: Copy assets
        run: |
          cp -r src-rules/assets _site/assets || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check deployment status
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment failed. This usually means GitHub Pages is not enabled."
          echo "::warning::Please enable GitHub Pages in repository Settings → Pages → Source: GitHub Actions"
          echo "::warning::Once enabled, the workflow will automatically deploy on the next run."
          exit 1
