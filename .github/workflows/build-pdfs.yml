name: Refresh Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-docs:
    # Skip if commit message contains [skip ci]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX (for PDFs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra \
            fonts-dejavu fonts-liberation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh combined sources and docs
        run: |
          make combine refresh-docs check-untranslated

      - name: Build PDFs + single-page HTML and copy to repo root
        run: |
          make pdf html docs-artifacts

      - name: Install Vale
        run: |
          wget -qO- https://github.com/errata-ai/vale/releases/download/v3.10.0/vale_3.10.0_Linux_64-bit.tar.gz | tar -xz
          sudo mv vale /usr/local/bin/
          vale --version

      - name: Regenerate Vale rules from memory.json
        run: |
          pip3 install pyyaml
          python3 scripts/generate_vale_vocab.py

      - name: Run Vale
        run: |
          vale sync
          # Check Finnish content only, exclude English corpus
          vale --config .vale.ini --output=line --sort \
            --glob='!corpus/english/**' \
            --glob='!documents/english/**' \
            README.md docs/ src-rules/ || exit 1

      - name: Commit refreshed docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ src-rules/*-combined.md
          if ! git diff --staged --quiet; then
            git commit -m "Refresh docs and published artifacts [skip ci]"
            git push
          else
            echo "No docs changes to commit"
          fi
