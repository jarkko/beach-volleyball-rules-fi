StylesPath = styles

MinAlertLevel = suggestion

Packages = Microsoft, proselint

# Finnish content - apply Finnish-specific rules
[{src-rules/**/*.md,docs/**/*.md,corpus/finnish/**,documents/finnish/**}]
BasedOnStyles = BeachVolley

# English content - no Finnish-specific rules
[{corpus/english/**,documents/english/**,README.md,*.md}]
BasedOnStyles = Vale

